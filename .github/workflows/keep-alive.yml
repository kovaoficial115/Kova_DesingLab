name: Mantener activo Supabase (colaboración)

# El plan gratuito de Supabase pausa un proyecto tras 7 días sin actividad. Cada 3 días se hace
# una consulta mínima a la base de datos de kova-designlab y se comprueba el servidor kova-collab.
# Solo afecta a kova-designlab (no al catálogo). La clave es la *publicable*: es pública por diseño
# y solo permite ejecutar public.ping(), que devuelve la hora del servidor.

on:
  schedule:
    - cron: '17 13 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://ljwjjhiurgesowiwonyt.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_5ToxBwlxelG_ActjT_jf0A_PnCztbHI
    steps:
      - name: Consulta a la base de datos
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' -d '{}'
      - name: Servidor de colaboración
        run: curl -fsS --retry 3 --retry-delay 10 "$SUPABASE_URL/functions/v1/kova-collab/"
