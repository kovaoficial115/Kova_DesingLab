[package]
name = "kova-designlab"
version = "0.1.0"
description = "KOVA Design Lab: editor DTF y Estudio 3D de prendas"
authors = ["Juan Felipe Machado"]
edition = "2024"
rust-version = "1.90"

[lib]
# nombre distinto del binario (requisito de Cargo en macOS)
name = "kova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
